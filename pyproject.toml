[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-access-switch-audit"
version = "0.9.0"
description = "Cisco access switch audit tool with CLI, TUI, jump host support, and Excel reporting"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Christopher Davies" },
]
requires-python = ">=3.10"
keywords = ["cisco", "network", "audit", "switch", "netmiko", "excel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "textfsm>=1.1.3",
    "pandas>=2.2.1",
    "openpyxl>=3.1.2",
    "PyYAML>=6.0",
    "paramiko>=2.12.0",
    "netmiko>=4.2.0",
    "pydantic>=2.9",
    "textual>=0.80.0",
    "rich>=13.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "pywin32>=305; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
cisco-access-switch-audit = "switch_audit.__main__:main"

[project.urls]
Homepage = "https://github.com/Nautomation-Prime/Access_Switch_Audit"
Repository = "https://github.com/Nautomation-Prime/Access_Switch_Audit"
Releases = "https://github.com/Nautomation-Prime/Access_Switch_Audit/releases"
Issues = "https://github.com/Nautomation-Prime/Access_Switch_Audit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["switch_audit*", "assets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:switch_audit.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["python_runtime", ".venv", "build", "dist"]

[tool.ruff.lint]
# Correctness plus the stylistic families: isort (I), pyupgrade (UP) and
# flake8-bugbear (B). Bugbear in particular catches real defects - mutable
# default arguments, silently-truncating zip(), except/continue swallowing.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    # Netmiko/paramiko failures derive from SSHException, not OSError, so the
    # per-device and per-collector boundaries deliberately catch Exception.
    # Each site carries a comment explaining why.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on intentionally odd inputs and use short-lived lambdas.
"tests/*" = ["B011", "E731"]
