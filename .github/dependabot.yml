---
# Dependency update policy.
#
# Added after CVE-2026-44405 (paramiko "allows the SHA-1 algorithm") was raised
# against the pinned paramiko 4.0.0. That one is fixed in paramiko 5.0.0, but
# netmiko 4.7.0 pins paramiko<5.0, so it cannot be taken yet. Dependabot is
# configured here so the fix is picked up automatically the moment netmiko
# relaxes that constraint, rather than depending on someone noticing.
#
# NOTE ON THE LOCK FILE
# requirements.lock.txt is generated by `uv pip compile --universal`, which
# Dependabot does not know how to regenerate. It will bump individual pins in
# place, which can leave the lock internally inconsistent with its transitive
# dependencies. When reviewing a Dependabot PR that touches the lock, update
# the constraint in requirements.txt if needed and regenerate rather than
# merging the edited lock as-is:
#
#   uv pip compile requirements.txt --universal \
#       --python-version 3.10 --output-file requirements.lock.txt

version: 2

updates:
  # ── Python dependencies ────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # Routine minor and patch bumps arrive as a single PR so the queue stays
      # readable. Security updates are raised on their own and are never
      # grouped away, so they keep their own visible PR.
      routine:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ── Actions used by the test workflow ──────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - ci
    commit-message:
      prefix: ci
