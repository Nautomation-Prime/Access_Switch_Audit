name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # This is a Windows-first tool: a console-encoding regression once
          # broke `--help` on the ANSI code page while Linux CI stayed green.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Verify the entry points actually start
        shell: bash
        run: |
          python -m switch_audit --version
          python -m switch_audit --help > /dev/null
          python -m switch_audit --list-collectors > /dev/null
          python -m switch_audit --show-config > /dev/null
          cisco-access-switch-audit --version

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: pip install ruff yamllint

      - name: Lint YAML
        run: yamllint .github/workflows .github/dependabot.yml config.yaml .yamllint

      - name: Lint Python
        run: ruff check switch_audit assets tests
